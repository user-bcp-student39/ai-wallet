[project]
name = "ai-wallet-backend"
version = "0.1.0"
description = "Backend de onboarding de wallet (LangGraph + FastAPI, arquitectura hexagonal)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "langgraph==1.2.18",
    "langgraph-checkpoint==4.3.1",
    "ag-ui-langgraph==0.0.47",
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "langchain-core==1.7.3",
    "python-dotenv==1.2.4",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["domain*", "application*", "ports*", "adapters*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
